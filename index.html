  <style>
    .masthead .sun-night, .masthead .sun-dusk { display: none; }
    html.night .masthead .sun-day, html.night .masthead .sun-dusk { display: none; }
    html.night .masthead .sun-night { display: block; }
    html.dusk .masthead .sun-day, html.dusk .masthead .sun-night { display: none; }
    html.dusk .masthead .sun-dusk { display: block; }
    .masthead--home .sun { cursor: pointer; }
    .masthead--home {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
    }
    .mast-portrait {
      display: block;
      text-decoration: none;
      text-align: center;
      flex: 0 0 auto;
    }
    .mast-portrait { position: relative; }
    .mast-portrait img {
      display: block;
      width: 176px;
      height: 176px;
      object-fit: cover;
      image-rendering: auto; /* a real photograph, not pixel art */
      border: 2px solid var(--ink);
    }
    .mast-portrait:hover img { border-color: var(--sunset); }
    @media (max-width: 480px) {
      .mast-portrait img { width: 128px; height: 128px; }
    }

    .elsewhere-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: wrap;
    }
    .elsewhere-row .px-links { flex: 1 1 300px; }
    .gb-tile {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 160px;
      height: 160px;
      background: var(--paper-dim);
      border: 2px solid var(--ink);
      position: relative;
      text-decoration: none;
    }
    .gb-tile .plate {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--pool);
    }
    .gb-tile:hover { border-color: var(--sunset); }
    .gb-tile:hover .plate { color: var(--sunset); }
    .gb-tile:active { transform: translate(2px, 2px); }
    .gb-tile:active::after { top: 2px; left: 2px; right: -4px; bottom: -4px; }

    .dock {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin: 24px 0 8px;
    }
    .dock-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 6px 12px;
      background: var(--paper-dim);
      border: 2px solid var(--ink);
      position: relative;
      text-decoration: none;
    }
    .dock-tile .label {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--pool);
      text-align: center;
      line-height: 1.3;
    }
    .dock-tile:hover { border-color: var(--sunset); }
    .dock-tile:hover .label { color: var(--sunset); }
    .dock-tile:active { transform: translate(2px, 2px); }
    .dock-tile:active::after { top: 2px; left: 2px; right: -4px; bottom: -4px; }
    .dock-tile::after, .ew-tile::after, .gb-tile::after, .tip-btn::after,
    .mast-portrait::after, .memoriam-photo::after {
      content: '';
      position: absolute;
      z-index: -1;
      top: 4px;
      left: 4px;
      right: -6px;
      bottom: -6px;
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" shape-rendering="crispEdges"><rect width="2" height="2" fill="%231A1A18"/><rect x="2" y="2" width="2" height="2" fill="%231A1A18"/></svg>');
      background-size: 4px 4px;
      image-rendering: pixelated;
    }
    /* ---- mwm windows (Motif/CDE chrome, roost palette) ---- */
    .mwm-window {
      position: fixed;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 2px solid var(--ink);
      width: min(92vw, 900px);
      height: min(84vh, 720px);
      z-index: 50;
    }
    .mwm-window::after {
      content: '';
      position: absolute;
      z-index: -1;
      top: 6px;
      left: 6px;
      right: -8px;
      bottom: -8px;
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" shape-rendering="crispEdges"><rect width="2" height="2" fill="%231A1A18"/><rect x="2" y="2" width="2" height="2" fill="%231A1A18"/></svg>');
      background-size: 4px 4px;
      image-rendering: pixelated;
    }
    .mwm-title {
      display: flex;
      align-items: stretch;
      height: 34px;
      background: var(--pool);
      border-bottom: 2px solid var(--ink);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .mwm-window.dragging .mwm-title { cursor: grabbing; }
    .mwm-window:not(.top) .mwm-title { background: var(--paper-dim); }
    .mwm-title .name {
      flex: 1;
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      white-space: nowrap;
    }
    .mwm-window:not(.top) .mwm-title .name { color: var(--ink); }
    .mwm-title button {
      width: 34px;
      border: 0;
      border-left: 2px solid var(--ink);
      background: var(--paper-dim);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 14px;
      cursor: pointer;
      padding: 0;
    }
    .mwm-title button:first-child { border-left: 0; border-right: 2px solid var(--ink); }
    .mwm-title button:hover { background: var(--sunset); color: var(--paper); }
    .mwm-window iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: var(--paper);
    }
    .quiet-door { color: var(--ink); text-decoration: none; }
    .quiet-door:hover { color: var(--sunset); }
    .mast-left { position: relative; }
    .tipjar { display: flex; align-items: center; gap: 22px; width: fit-content; margin: 24px 0; }
    .tipjar .jar { flex: 0 0 72px; }
    /* z-index:0 makes these stacking contexts: the negative-z dither
       shadows inside must paint above the panel's opaque background */
    .tip-actions { display: flex; gap: 16px; flex-wrap: wrap; position: relative; z-index: 0; }
    .tip-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border: 2px solid var(--ink);
      cursor: pointer;
      position: relative;
      padding: 0;
    }
    .tip-btn.venmo { background: var(--pool); color: #F3EEDF; }
    .tip-btn.btc-copy { background: #E8C84A; color: #1A1A18; }
    .tip-btn:hover { border-color: var(--sunset); }
    .tip-btn:active { transform: translate(2px, 2px); }
    .tip-btn:active::after { top: 2px; left: 2px; right: -4px; bottom: -4px; }
    /* buttons keep constant colors, so their sprites skip the night ink-flip */
    html.night .tip-btn svg.px-art rect[fill="#1A1A18"] { fill: #1A1A18; }
    html.night .dock-tile::after, html.night .ew-tile::after, html.night .gb-tile::after,
    html.night .tip-btn::after, html.night .mast-portrait::after, html.night .memoriam-photo::after,
    html.night .mwm-window::after {
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" shape-rendering="crispEdges"><rect width="2" height="2" fill="%23605E56"/><rect x="2" y="2" width="2" height="2" fill="%23605E56"/></svg>');
    }
    .tip-btn .tip-check { display: none; }
    .tip-btn.copied .tip-coin { display: none; }
    .tip-btn.copied .tip-check { display: block; }
    .colophon-door { color: var(--ink); text-decoration: none; }
    .colophon-door:hover { color: var(--sunset); }
    .memoriam { display: flex; align-items: center; gap: 20px; }
    .memoriam-photo { flex: 0 0 auto; display: block; }
    .memoriam-photo { position: relative; z-index: 0; }
    .memoriam-photo img {
      display: block;
      width: 88px;
      height: 88px;
      object-fit: cover;
      image-rendering: auto; /* a real photograph */
      border: 2px solid var(--ink);
    }
    .memoriam-photo:hover img { border-color: var(--sunset); }
    .ew-tiles { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin: 24px 0 8px; }
    .ew-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: var(--paper-dim);
      border: 2px solid var(--ink);
      position: relative;
    }
    .ew-tile:hover { border-color: var(--sunset); }
    .ew-tile:active { transform: translate(2px, 2px); }
    .ew-tile:active::after { top: 2px; left: 2px; right: -4px; bottom: -4px; }

  <script>
    (function () {
      function cycle() {
        var el = document.documentElement;
        var cur = el.classList.contains('night') ? 'night' : el.classList.contains('dusk') ? 'dusk' : 'day';
        var next = cur === 'day' ? 'dusk' : cur === 'dusk' ? 'night' : 'day';
        el.classList.remove('night', 'dusk');
        if (next !== 'day') el.classList.add(next);
        try { sessionStorage.roost_mode = next; } catch (e) {}
      }
      document.querySelectorAll('.masthead--home .sun').forEach(function (el) {
        el.addEventListener('click', cycle);
      });
    })();
  </script>


  <script>
    (function () {
      if (window.matchMedia('(max-width: 700px)').matches) return; // phones navigate
      var wins = [];

      function retitle() {
        wins.forEach(function (w, i) {
          w.classList.toggle('top', i === wins.length - 1);
          w.style.zIndex = 50 + i;
        });
      }

      function closeWin(w, viaHistory) {
        var i = wins.indexOf(w);
        if (i === -1) return;
        wins.splice(i, 1);
        w.remove();
        retitle();
        if (!viaHistory && history.state && history.state.mwm) history.back();
      }

      function openWindow(href, title) {
        if (wins.length >= 4) closeWin(wins[0], true);
        var w = document.createElement('div');
        w.className = 'mwm-window';
        var off = wins.length * 28;
        w.style.left = 'calc(50% - min(46vw, 450px) + ' + off + 'px)';
        w.style.top = 'calc(7vh + ' + off + 'px)';

        var bar = document.createElement('div');
        bar.className = 'mwm-title';
        var menu = document.createElement('button');
        menu.textContent = '\u2500';
        menu.setAttribute('aria-label', 'Close window');
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = title;
        var maxi = document.createElement('button');
        maxi.textContent = '\u25A1';
        maxi.setAttribute('aria-label', 'Open as full page');
        bar.appendChild(menu); bar.appendChild(name); bar.appendChild(maxi);

        var frame = document.createElement('iframe');
        frame.src = href;
        frame.title = title;
        w.appendChild(bar); w.appendChild(frame);
        document.body.appendChild(w);
        wins.push(w);
        retitle();
        history.pushState({ mwm: 1 }, '', '#' + href.replace('.html', ''));

        menu.addEventListener('click', function () { closeWin(w); });
        maxi.addEventListener('click', function () { window.location.href = href; });
        w.addEventListener('mousedown', function () {
          var i = wins.indexOf(w);
          if (i !== -1 && i !== wins.length - 1) { wins.splice(i, 1); wins.push(w); retitle(); }
        });

        // drag by titlebar
        bar.addEventListener('pointerdown', function (ev) {
          if (ev.target !== bar && ev.target !== name) return;
          var sx = ev.clientX - w.offsetLeft, sy = ev.clientY - w.offsetTop;
          w.classList.add('dragging');
          bar.setPointerCapture(ev.pointerId);
          function move(e) {
            w.style.left = Math.max(8 - w.offsetWidth + 120, Math.min(e.clientX - sx, innerWidth - 120)) + 'px';
            w.style.top = Math.max(0, Math.min(e.clientY - sy, innerHeight - 40)) + 'px';
          }
          function up() {
            w.classList.remove('dragging');
            bar.removeEventListener('pointermove', move);
            bar.removeEventListener('pointerup', up);
          }
          bar.addEventListener('pointermove', move);
          bar.addEventListener('pointerup', up);
        });
        menu.focus();
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && wins.length) closeWin(wins[wins.length - 1]);
      });
      window.addEventListener('popstate', function () {
        if (wins.length) closeWin(wins[wins.length - 1], true);
      });

      document.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (!/^[a-z0-9-]+\.html$/.test(href)) return; // internal pages only
        e.preventDefault();
        var label = a.querySelector('.label');
        var title = (label && label.textContent) || a.getAttribute('aria-label') ||
                    (a.textContent || '').trim() || href.replace('.html', '');
        openWindow(href, title.toLowerCase());
      });

      // deep link: /#film opens the film window
      var h = location.hash.replace('#', '');
      if (/^[a-z-]+$/.test(h)) {
        var page = h + '.html';
        history.replaceState(null, '', location.pathname);
        openWindow(page, h.replace('-', ' '));
      }
    })();
  </script>

  <script>
    (function () {
      var b = document.querySelector('.btc-copy');
      if (!b) return;
      b.addEventListener('click', function () {
        navigator.clipboard.writeText(b.getAttribute('data-addr')).then(function () {
          b.classList.add('copied');
          setTimeout(function () { b.classList.remove('copied'); }, 1600);
        });
      });
    })();
  </script>
