<!--
  self-hosting.html — Self-hosting (v3 retro/pixel system)
  ---------------------------------------------------------
  Hydrates from services-data.json, a snapshot of what's actually running
  on the homelab (refresh with tools/export-services.sh — it reads
  container names + compose projects over SSH; nothing sensitive is
  published: no ports, IPs, versions, or hardware details). The GROUPS
  and DESCRIPTIONS maps below are the editorial layer; services missing
  from them still render, just undescribed. On success the JS sets
  data-hydrated="services" on <main>.
-->

  <script>
    (function () {
      // Grouping mirrors the lab's Glance dashboard, not compose projects.
      var GROUP_ORDER = ['Clients', 'Utilities', 'Monitoring', 'Arr stack',
        'Discord bots', 'Downloads', 'Security', 'Auxiliary'];
      var NAME_GROUPS = {
        audiobookshelf: 'Clients', grimmory: 'Clients', komga: 'Clients', plex: 'Clients',
        'btc-rpc-explorer': 'Utilities', homeassistant: 'Utilities', immich: 'Utilities',
        mealie: 'Utilities', minecraft: 'Utilities', paperless: 'Utilities',
        seerr: 'Utilities', sure: 'Utilities',
        dockhand: 'Monitoring', homepage: 'Monitoring', netdata: 'Monitoring',
        notifiarr: 'Monitoring', 'speedtest-tracker': 'Monitoring',
        tautulli: 'Monitoring', 'uptime-kuma': 'Monitoring',
        kapowarr: 'Arr stack', lidarr: 'Arr stack', prowlarr: 'Arr stack',
        radarr: 'Arr stack', shelfmark: 'Arr stack', sonarr: 'Arr stack',
        'discord-blackjack': 'Discord bots', 'tok-bot': 'Discord bots',
        qbittorrent: 'Downloads', sabnzbd: 'Downloads', slskd: 'Downloads',
        adguard: 'Security', crowdsec: 'Security'
        // everything unmapped falls into Auxiliary
      };

      var DESCRIPTIONS = {
        plex: 'movies, TV, and music for the whole house',
        tautulli: 'watch statistics for Plex',
        notifiarr: 'notification hub',
        sonarr: 'TV automation',
        radarr: 'movie automation',
        lidarr: 'music automation',
        bazarr: 'subtitles',
        profilarr: 'quality profiles',
        seerr: 'the family’s request portal',
        prowlarr: 'indexer manager',
        sabnzbd: 'usenet downloader',
        qbittorrent: 'torrent client',
        'qbit-manage': 'torrent housekeeping',
        slskd: 'soulseek client',
        audiobookshelf: 'audiobooks & podcasts',
        komga: 'comics server',
        kapowarr: 'comics automation',
        shelfmark: 'book tracking',
        grimmory: 'library manager',
        immich: 'the family photo library',
        paperless: 'document archive',
        mealie: 'recipe manager',
        sure: 'personal finance',
        adguard: 'network-wide ad blocking + DNS',
        homepage: 'the lab’s dashboard',
        glance: 'at-a-glance dashboard',
        netdata: 'metrics',
        'uptime-kuma': 'uptime monitoring',
        'speedtest-tracker': 'ISP speed history',
        crowdsec: 'intrusion detection',
        dockhand: 'container updates',
        homeassistant: 'home automation',
        bitcoind: 'a full Bitcoin node',
        'btc-rpc-explorer': 'block explorer for the node',
        minecraft: 'the kids’ Minecraft server',
        bedrockconnect: 'console Minecraft helper',
        'tok-bot': 'a Discord bot I wrote',
        'discord-blackjack': 'a blackjack Discord bot I wrote'
      };

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function fail() {
        var p = document.getElementById('sh-fallback');
        p.textContent = 'Data feed unavailable. The service inventory could not be loaded.';
        p.style.display = 'block';
      }

      fetch('services-data.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (data) {
          document.getElementById('sh-updated').textContent =
            'Generated from the lab itself. Snapshot from ' +
            new Date(data.fetchedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + '.';

          function groupOf(s) { return NAME_GROUPS[s.name] || 'Auxiliary'; }

          var stats = document.getElementById('sh-stats');
          [
            [data.services.length, 'services running'],
            [GROUP_ORDER.length, 'groups'],
            ['1', 'small server in a closet']
          ].forEach(function (pair) {
            var tile = el('div', 'px-stat');
            tile.appendChild(el('div', 'value', String(pair[0])));
            tile.appendChild(el('div', 'label', pair[1]));
            stats.appendChild(tile);
          });

          var wrap = document.getElementById('sh-groups');
          GROUP_ORDER.forEach(function (group) {
            var items = data.services.filter(function (s) { return groupOf(s) === group; });
            if (!items.length) return;
            items.sort(function (a, b) { return a.name.localeCompare(b.name); });
            var section = el('section', 'sh-group');
            section.appendChild(el('h2', null, group));
            var table = el('table', 'px-table sh-table');
            var tbody = el('tbody');
            items.forEach(function (s) {
              var tr = el('tr');
              tr.appendChild(el('td', null, s.name));
              tr.appendChild(el('td', 'desc', DESCRIPTIONS[s.name] || ''));
              tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            section.appendChild(table);
            wrap.appendChild(section);
          });

          document.getElementById('main').setAttribute('data-hydrated', 'services');
        })
        .catch(fail);
    })();
  </script>
