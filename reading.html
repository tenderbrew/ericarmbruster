  reading.html — Reading (v3 retro/pixel system)

  Hydrates from reading-data.json, baked daily by reading-fetch.js via
  update-reading.yml from the public Goodreads shelf RSS — log books on
  Goodreads and this page follows. Covers hotlink Goodreads' CDN. On
  success the JS sets data-hydrated="reading" on <main> for
  tools/screenshot.js.
-->

    .rd-shelf {

      margin: 24px 0;
    }
    .rd-card { margin: 0; }
    .rd-card a.cover-link {
      display: block;
      border: 2px solid var(--ink);
      box-shadow: 4px 4px 0 var(--shadow);
    }
    .rd-card a.cover-link:hover { border-color: var(--sunset); }
    .rd-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      object-fit: cover;
    }
    .rd-card figcaption { margin-top: 8px; font-size: 12px; }
    .rd-card .rd-author { display: block; color: var(--pool); margin-top: 2px; }

    .rd-rating {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--sunset);
    }
    /* padding-top/bottom only — px-bullets owns padding-left for the sprite */
    ul.rd-toread li { padding-top: 2px; padding-bottom: 2px; }

  <hr class="px-wave">

  <main id="main">

    <p class="rd-fallback" id="rd-fallback"></p>

    <h2>Currently reading</h2>
    <div class="rd-shelf" id="rd-current"></div>

    <hr class="px-wave">

    <h2>Read</h2>
    <table class="px-table">
      <thead>
        <tr><th>Book</th><th>Author</th><th>Rating</th><th class="num">Finished</th></tr>
      </thead>
      <tbody id="rd-read"></tbody>
    </table>

    <h2>Up next</h2>
    <ul class="px-bullets rd-toread" id="rd-toread"></ul>

    <p id="rd-profile"></p>

  </main>

  <footer>
    <p>&copy; 2026 Eric Armbruster</p>
  </footer>

  <script>
    (function () {
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function stars(rating) {
        var s = '';
        for (var i = 0; i < rating; i++) s += '★';
        return s;
      }

      function bookLink(b) {
        var a = el('a', null, b.title);
        a.href = b.link;
        a.target = '_blank';
        a.rel = 'noopener';
        return a;
      }

      function fail() {
        var p = document.getElementById('rd-fallback');
        p.textContent = 'Data feed unavailable. The bookshelf could not be loaded.';
        p.style.display = 'block';
      }

      fetch('reading-data.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (data) {
          document.getElementById('rd-updated').textContent =
            'From the Goodreads shelves. Updated ' +
            new Date(data.fetchedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + '.';

          var current = document.getElementById('rd-current');
          data.currentlyReading.forEach(function (b) {
            var fig = el('figure', 'rd-card');
            if (b.cover) {
              var a = el('a', 'cover-link');
              a.href = b.link;
              a.target = '_blank';
              a.rel = 'noopener';
              var img = el('img');
              img.src = b.cover;
              img.alt = 'Cover of ' + b.title;
              img.loading = 'lazy';
              a.appendChild(img);
              fig.appendChild(a);
            }
            var cap = el('figcaption');
            cap.appendChild(el('span', null, b.title));
            cap.appendChild(el('span', 'rd-author', b.author));
            fig.appendChild(cap);
            current.appendChild(fig);
          });

          var read = document.getElementById('rd-read');
          data.read.forEach(function (b) {
            var tr = el('tr');
            var td = el('td');
            td.appendChild(bookLink(b));
            tr.appendChild(td);
            tr.appendChild(el('td', null, b.author));
            tr.appendChild(el('td', 'rd-rating', stars(b.rating)));
            tr.appendChild(el('td', 'num', b.readAt || ''));
            read.appendChild(tr);
          });

          var toread = document.getElementById('rd-toread');
          data.toRead.forEach(function (b) {
            var li = el('li');
            li.appendChild(bookLink(b));
            li.appendChild(document.createTextNode(' — ' + b.author));
            toread.appendChild(li);
          });

          var profile = document.getElementById('rd-profile');
          var pa = el('a', null, 'Shelves on Goodreads');
          pa.href = data.profileUrl;
          pa.target = '_blank';
          pa.rel = 'noopener';
          profile.appendChild(pa);

          document.getElementById('main').setAttribute('data-hydrated', 'reading');
        })
        .catch(fail);
    })();
  </script>
