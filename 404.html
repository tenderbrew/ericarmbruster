<!--
  404.html — GitHub Pages custom not-found page (v3 retro/pixel system)
  ---------------------------------------------------------------------
  Served by GitHub Pages for any unmatched path. Many old v1 URLs
  (about, film, video-games, …) land here since the July 2026 rebuild,
  so the message says the sections are coming back. noindex so search
  engines don't list the error page.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Not found &mdash; Eric Armbruster</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F3EEDF">

  <link rel="icon" href="/images/hector-favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/pixel-base.css">
</head>
<body>

  <header class="masthead">
    <svg class="px-art" width="256" height="144" viewBox="0 0 32 18" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="0" y="6" width="32" height="1" fill="#2E6FBF"/>
      <rect x="4" y="8" width="2" height="1" fill="#2E6FBF"/>
      <rect x="15" y="8" width="1" height="1" fill="#2E6FBF"/>
      <rect x="26" y="8" width="2" height="1" fill="#2E6FBF"/>
      <rect x="14" y="9" width="4" height="1" fill="#E8743B"/>
      <rect x="13" y="10" width="6" height="1" fill="#E8743B"/>
      <rect x="13" y="11" width="6" height="1" fill="#E8743B"/>
      <rect x="14" y="12" width="4" height="1" fill="#E8743B"/>
      <rect x="6" y="14" width="2" height="1" fill="#2E6FBF"/>
      <rect x="18" y="14" width="2" height="1" fill="#2E6FBF"/>
      <rect x="10" y="16" width="2" height="1" fill="#2E6FBF"/>
      <rect x="21" y="16" width="2" height="1" fill="#2E6FBF"/>
    </svg>
    <h1>404</h1>
  </header>

  <hr class="px-wave">

  <main id="main">
    <p>There's no page at this address.</p>
    <p>
      The site was rebuilt in July 2026, so most of the old pages are gone
      for now while their sections are redesigned.
    </p>
    <p><a href="/">Back to the homepage</a></p>
  </main>

</body>
</html>
