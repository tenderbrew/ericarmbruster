<!--
  hector.html — Hector (v3 retro/pixel system)
  ---------------------------------------------
  Photo page for the resident dog (he is also the site favicon). Uses the
  shared .px-gallery component; photos live in images/hector/ as
  -thumb.jpg (400 square) + -lg.jpg (1200 max) pairs, sourced from the
  Immich library. Lightbox is the same inline pattern as seymour.html.
  To add a photo: process thumb/lg pair, copy a figure block, done.
-->

  <script>try{var m=sessionStorage.roost_mode;if(!m&&!navigator.webdriver){var h=+new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",hour12:false}).format(new Date());m=(h>=21||h<6)?"night":(h<8||h>=19)?"dusk":"day"}if(m==="night"||m==="dusk")document.documentElement.classList.add(m)}catch(e){}</script>

  <style>
    .site-nav { margin-bottom: 32px; }
    .site-nav a {
      font-family: var(--font-display);
      font-size: 16px;
      text-decoration: none;
    }
    /* The favicon at 8x, honest pixels — Hector as sprite. */
    .hx-sprite {
      image-rendering: pixelated;
      width: 128px;
      height: 128px;
      aspect-ratio: auto;
    }
    .hx-masthead { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

    .hx-photo-btn {
      display: block;
      width: 100%;
      padding: 0;
      background: none;
      border: 2px solid var(--ink);
      box-shadow: 4px 4px 0 var(--shadow);
      cursor: pointer;
    }
    .hx-photo-btn:hover { border-color: var(--sunset); }
    .hx-photo-btn img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
      image-rendering: auto; /* real photographs, not pixel art */
    }

    /* Lightbox (same pattern as seymour.html) */
    .hx-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(26, 26, 24, 0.94);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 48px 16px 16px;
    }
    .hx-lightbox--open { display: flex; }
    .hx-lightbox-img {
      max-width: min(92vw, 900px);
      max-height: 78vh;
      border: 2px solid var(--paper);
      box-shadow: 4px 4px 0 var(--shadow);
    }
    .hx-lightbox-caption {
      margin-top: 16px;
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--paper);
      text-align: center;
    }
    .hx-lightbox button {
      position: absolute;
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 4px 4px 0 var(--shadow);
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 1;
      width: 44px;
      height: 44px;
      cursor: pointer;
      padding: 0;
    }
    .hx-lightbox button:hover { color: var(--sunset); }
    .hx-lightbox-close { top: 16px; right: 16px; }
    .hx-lightbox-prev { left: 16px; top: 50%; }
    .hx-lightbox-next { right: 16px; top: 50%; }
  </style>

  <!-- Lightbox overlay (same inline pattern as seymour.html). -->
  <div class="hx-lightbox" id="hx-lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true" tabindex="-1">
    <button class="hx-lightbox-close" aria-label="Close">&times;</button>
    <button class="hx-lightbox-prev" aria-label="Previous photo">&#8249;</button>
    <button class="hx-lightbox-next" aria-label="Next photo">&#8250;</button>
    <img class="hx-lightbox-img" id="hx-lightbox-img" src="" alt="">
    <div class="hx-lightbox-caption" id="hx-lightbox-caption"></div>
  </div>

  <script>
    (function () {
      var lightbox = document.getElementById('hx-lightbox');
      var lbImg = document.getElementById('hx-lightbox-img');
      var lbCaption = document.getElementById('hx-lightbox-caption');
      var closeBtn = lightbox.querySelector('.hx-lightbox-close');
      var prevBtn = lightbox.querySelector('.hx-lightbox-prev');
      var nextBtn = lightbox.querySelector('.hx-lightbox-next');
      var galleryItems = Array.from(document.querySelectorAll('#hx-gallery figure'));
      var mainEl = document.getElementById('main');
      var focusable = [closeBtn, prevBtn, nextBtn];
      var currentIndex = 0;

      function showPhoto(index) {
        currentIndex = index;
        var item = galleryItems[index];
        var img = item.querySelector('img');
        lbImg.src = img.getAttribute('data-full') || img.src;
        lbImg.alt = img.alt;
        var spans = item.querySelectorAll('figcaption span');
        lbCaption.textContent = spans.length ? spans[0].textContent + (spans[1] ? ' — ' + spans[1].textContent : '') : '';
      }
      function navigate(delta) {
        var next = currentIndex + delta;
        if (next < 0) next = galleryItems.length - 1;
        if (next >= galleryItems.length) next = 0;
        showPhoto(next);
      }
      var lastTrigger = null;
      function open(index, trigger) {
        lastTrigger = trigger || null;
        showPhoto(index);
        lightbox.setAttribute('aria-hidden', 'false');
        lightbox.classList.add('hx-lightbox--open');
        document.body.style.overflow = 'hidden';
        if (mainEl) {
          mainEl.setAttribute('aria-hidden', 'true');
          mainEl.inert = true;
        }
        closeBtn.focus();
      }
      galleryItems.forEach(function (item, i) {
        var trigger = item.querySelector('.hx-photo-btn');
        trigger.addEventListener('click', function () { open(i, trigger); });
      });
      function close() {
        lightbox.classList.remove('hx-lightbox--open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (mainEl) {
          mainEl.removeAttribute('aria-hidden');
          mainEl.inert = false;
        }
        if (lastTrigger && typeof lastTrigger.focus === 'function') lastTrigger.focus();
        lastTrigger = null;
      }
      function trapFocus(e) {
        if (e.key !== 'Tab') return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        var active = document.activeElement;
        if (e.shiftKey) {
          if (active === first || !lightbox.contains(active)) {
            e.preventDefault();
            last.focus();
          }
        } else {
          if (active === last || !lightbox.contains(active)) {
            e.preventDefault();
            first.focus();
          }
        }
      }
      closeBtn.addEventListener('click', close);
      prevBtn.addEventListener('click', function () { navigate(-1); });
      nextBtn.addEventListener('click', function () { navigate(1); });
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) close();
      });
      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('hx-lightbox--open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'ArrowRight') navigate(1);
        trapFocus(e);
      });
    })();
  </script>
