# Runs btc-fetch.js every 3 hours, commits updated JSON back to the repo.
# mempool.space, CryptoCompare, and the CoinDesk RSS need no API key.
name: Update Bitcoin Data

on:
  schedule:
    - cron: '15 */3 * * *' # Every 3 hours at :15 (offset from the other crons)
  workflow_dispatch: # Manual trigger from Actions tab

permissions:
  contents: write # the bot commits data back to main

concurrency:
  group: update-btc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Fetch bitcoin data
        run: node btc-fetch.js

      # Skip commit if nothing changed.
      - name: Commit and push if changed
        run: |
          git diff --quiet btc-data.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc-data.json
          git commit -m "chore: update btc data"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
