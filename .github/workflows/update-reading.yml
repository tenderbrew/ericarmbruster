# Validation only: private exports never enter Actions, and nothing is refreshed/committed here.
name: Validate Reading Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-reading
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test offline importer (synthetic data only)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test reading hydration (synthetic data only)
        run: node --test tests/reading-page.test.js
      - name: Validate committed snapshot (no refresh)
        run: python3 tools/import_goodreads.py --validate
